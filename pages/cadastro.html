<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Modas Caridosas</title>
</head>
<body>

    <h1>Modas Caridosas</h1>

    <h2>Crie sua conta</h2>

    <form action="#" method="post">

        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        <br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">
        <br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
        <br><br>

        <label for="confirmar-senha">Confirmar senha:</label><br>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha" required>
        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <p>Já possui uma conta? <a href="login.html">Faça login</a></p>

    <footer>
        <p>Modas Caridosas - Todos os direitos reservados.</p>
    </footer>

</body>
</html>

</body>
</html>
