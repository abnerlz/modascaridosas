
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="..//css/login.css" />

    <title>Tela de Login</title>
  </head>
  <body>

    <div class="cabecalho">
      <div class="name">
        <h1>Modas Caridosas</h1>
      </div>

      <div class="links">
        <a href="..//index.html">Inicio</a>
        <a href="encontrar-roupas.html">Encontrar roupas</a>
        <a href="quero-doar.html">Quero doar</a>
        <a href="sustentabilidade.html">Sustentabilidade</a>
      </div>
    </div>

    <div class="barra-acessibilidade" aria-label="Recursos de acessibilidade">

      <span>Acessibilidade:</span>

      <button type="button" id="diminuir-fonte"
              aria-label="Diminuir tamanho do texto">
          A−
      </button>

      <button type="button" id="aumentar-fonte"
              aria-label="Aumentar tamanho do texto">
          A+
      </button>

      <button type="button" id="alto-contraste"
              aria-pressed="false">
          Alto contraste
      </button>

      <button type="button" id="restaurar-acessibilidade">
          Restaurar
      </button>

    </div>

    <br /><br />

    <!--Caixa de login-->
    <main class="container">
      <form>
        <h1>Faça seu login</h1>

        <div class="input-box">
          <input type="email" id="email" placeholder="Digite seu email" />
          <i class="bx bxs-user"></i>
        </div>

        <div class="input-box">
          <input type="senha" id="senha" placeholder="Digite sua senha" />
          <i class="bx bxs-lock-alt"></i>
        </div>

        <div>
          <label class="remember-forgot">
            <input type="checkbox" />
            Lembrar senha?
          </label>
          <a href="#">Esqueci a senha</a>
        </div>

        <button type="submit" class="login">Login</button>

        <div class="register-link">
          <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
      </form>
    </main>

    <div class="footer">
      <footer>
        <p></p>
      </footer>
    </div>

  </body>
</html>
